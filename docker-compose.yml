services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: measurements
      POSTGRES_USER: measure
      POSTGRES_PASSWORD: measurepass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U measure -d measurements"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://measure:measurepass@db:5432/measurements}
      POSE_MODEL_PATH: /app/models/pose_landmarker_full.task
      IMAGE_DIR: /app/data/images/uploads
      STORE_IMAGES: "true"
    ports:
      - "8000:8000"
    volumes:
      - image_data:/app/data/images
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  image_data:
